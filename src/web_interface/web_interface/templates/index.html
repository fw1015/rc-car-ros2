<!DOCTYPE html>
<html>
<head>
    <title>RC Car Control</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=5">
</head>
<body>
    <div class="container">

        <div id="warning-top" class="warning-edge"></div>
        <div id="warning-left" class="warning-edge"></div>
        <div id="warning-right" class="warning-edge"></div>

        <div class="debug-parameters-panel">
            <div>FRONT: <span id="db-front">---</span></div>
            <div>LEFT:  <span id="db-left">---</span></div>
            <div>RIGHT: <span id="db-right">---</span></div>
            <hr class="debug-divider">
            <div>THR RAW:   <span id="db-throttle-raw">0.00</span></div>
            <div>THR ADJ:   <span id="db-throttle-adjusted" style="color: #00ff88;">0.00</span></div>
            <div>SRV RAW:   <span id="db-servo-raw">0.00</span></div>
            <div>SRV ADJ:   <span id="db-servo-adjusted" style="color: #00ff88;">0.00</span></div>
        </div>

        <div style="position: absolute; top: 90px; right: 15px; background: rgba(0, 0, 0, 0.7); padding: 10px; border-radius: 8px; border: 1px solid #444; z-index: 1000; font-family: monospace;">
            <div style="color: #00ff88; font-size: 12px; margin-bottom: 8px; text-transform: uppercase; text-align: center; letter-spacing: 1px;">Max Thrust Limit</div>
            <div style="display: flex; gap: 5px;">
                <button class="speed-btn" data-speed="0.25" style="background: #333; color: white; border: 1px solid #666; padding: 5px 10px; cursor: pointer; border-radius: 4px;">25%</button>
                <button class="speed-btn" data-speed="0.50" style="background: #333; color: white; border: 1px solid #666; padding: 5px 10px; cursor: pointer; border-radius: 4px;">50%</button>
                <button class="speed-btn active" data-speed="1.00" style="background: #00ff88; color: black; border: 1px solid #00ff88; padding: 5px 10px; cursor: pointer; border-radius: 4px; font-weight: bold;">100%</button>
            </div>
        </div>

        <div class="camera-container">
           <img id="camera-feed" 
                src="http://192.168.0.30:8080/stream?topic=/camera_node/image_raw&type=ros_compressed" 
                alt="Live Camera Feed">
        </div>

        <div class="sensor-overlay">
            <svg class="radar-svg" viewBox="0 0 200 200">
                <polygon id="cone-left" points="30,70 70,95 30,120" fill="rgba(0,255,136,0.3)" />
                
                <polygon id="cone-right" points="170,70 130,95 170,120" fill="rgba(0,255,136,0.3)" />
                
                <polygon id="cone-front" points="40,15 160,15 100,70" fill="rgba(0,255,136,0.3)" />
                <line x1="100" y1="70" x2="70" y2="15" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
                <line x1="100" y1="70" x2="100" y2="15" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
                <line x1="100" y1="70" x2="130" y2="15" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
                
                <rect x="70" y="70" width="60" height="90" rx="6" fill="#ffffff" />
                <rect x="75" y="65" width="50" height="15" fill="#333333" rx="2" /> 
            </svg>
            <div class="radar-text" id="radar-readout">ALL CLEAR</div>
        </div>

        <div class="bottom-controls">
            <div class="steering-controls">
                <button class="dir-btn" data-dir="left">◀</button>
                <button class="dir-btn" data-dir="right">▶</button>
            </div>

            <div class="throttle-controls">
                <button class="thrust-btn reverse" data-thrust="reverse">⏬</button>
                <button class="thrust-btn forward" data-thrust="forward">🚀</button>
            </div>
        </div>

        <div class="status-card">
            <div id="connection-status-container" class="connection-status">
                <span id="connection-state">Checking...</span>
                <span id="connection-metrics">(-- ms)</span>
            </div>
            <button id="shutdown-btn" class="shutdown-btn" title="Shutdown RC Car System">⏻</button>
        </div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}?v=5"></script>
</body>
</html>
